<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WMB+ Offline</title>
  <meta name="theme-color" content="#0b1115">
  <link rel="apple-touch-icon" href="/icons/wmb-plus-192.png">
  <link rel="icon" type="image/png" href="/icons/wmb-plus-192.png">
  <link rel="stylesheet" href="/output.css">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1115;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(420px, calc(100vw - 40px));
      text-align: center;
    }
    img {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      line-height: 1;
    }
    p {
      margin: 0 0 22px;
      color: #aeb8b3;
      line-height: 1.45;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      background: #47a864;
      color: #071116;
      font-weight: 850;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/wmb-plus-192.png" alt="WMB+">
    <h1>Reconnect to WMB+</h1>
    <p>The scale is not reachable from this page. Join the WMB+ access point or the same home WiFi network, then try again.</p>
    <a href="/">Retry</a>
  </main>
</body>
</html>
