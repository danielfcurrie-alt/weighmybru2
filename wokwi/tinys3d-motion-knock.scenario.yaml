name: TinyS3D proxy LIS2DW12 knock pattern
version: 1
author: WMB+
steps:
  - wait-serial: 'WMBP_TINY_LIS_RANGES_OK'
  - set-control:
      part-id: accel
      control: pattern
      value: 3
  - set-control:
      part-id: accel
      control: amplitudeG
      value: 0.8
  - wait-serial: 'WMBP_TINY_MOTION_KNOCK_OK'
  - delay: 5000ms
