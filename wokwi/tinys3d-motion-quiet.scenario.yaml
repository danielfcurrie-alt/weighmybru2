name: TinyS3D proxy LIS2DW12 quiet pattern
version: 1
author: WMB+
steps:
  - wait-serial: 'WMBP_TINY_LIS_RANGES_OK'
  - set-control:
      part-id: accel
      control: pattern
      value: 1
  - set-control:
      part-id: accel
      control: amplitudeG
      value: 1.0
  - wait-serial: 'WMBP_TINY_MOTION_QUIET_OK'
  - delay: 5000ms
