name: TinyS3D proxy LIS2DW12 vibration pattern
version: 1
author: WMB+
steps:
  - wait-serial: 'WMBP_TINY_LIS_RANGES_OK'
  - set-control:
      part-id: accel
      control: pattern
      value: 2
  - set-control:
      part-id: accel
      control: amplitudeG
      value: 0.20
  - wait-serial: 'WMBP_TINY_MOTION_VIBRATION_OK'
  - delay: 5000ms
