  # FLOAT32_NEWEST_MEDIAN_BAND_GRAMS/300ms bound the flat path near 3.3 g/s;
  # FLOAT32_COHERENT_RAMP_MAX_RATE_GPS bounds the ramp path at 12 g/s.
  # Watch lastFloat32SelectedSourceAgeMs step up as each bound is crossed.
