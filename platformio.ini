; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common configuration for both boards
[env]
platform = espressif32@6.12.0
framework = arduino
platform_packages =
  tasmota/tool-mklittlefs@^4.0.0
monitor_speed = 115200
board_build.filesystem = littlefs
upload_protocol = esptool
upload_speed = 460800
monitor_rts = 0
monitor_dtr = 0
build_flags = 
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Os
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=1
  -DCONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80
lib_deps = 
	robtillaart/HX711@^0.6.0
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	https://github.com/me-no-dev/AsyncTCP.git
	h2zero/NimBLE-Arduino@^1.4.0
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.11.9

; ESP32-S3-DevKitC-1 (SuperMini) Environment
[env:esp32s3-supermini]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = wmb_4mb_ota.csv
upload_flags = 
  --chip=esp32s3
  --before=default_reset
  --after=hard_reset
build_flags = 
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DBOARD_SUPERMINI

; XIAO ESP32S3 Environment  
[env:esp32s3-xiao]
board = seeed_xiao_esp32s3
board_upload.flash_size = 8MB
board_build.partitions = wmb_8mb_ota.csv
upload_flags = 
  --chip=esp32s3
  --before=default_reset
  --after=hard_reset
build_flags = 
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DBOARD_XIAO

; Unexpected Maker TinyS3[D] Environment
; PlatformIO currently exposes the TinyS3 board definition; TinyS3[D] keeps
; the same ESP32-S3FN8/8MB shape but replaces VBAT ADC sense with an I2C
; MAX17048 fuel gauge.
[env:esp32s3-tinys3d]
board = um_tinys3
board_upload.flash_size = 8MB
board_build.partitions = wmb_8mb_ota.csv
upload_flags =
  --chip=esp32s3
  --before=default_reset
  --after=hard_reset
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DBOARD_TINYS3D

; Explicit firmware simulation builds. These still run the real BLE/USB/web
; packet paths, but Scale bypasses HX711 hardware and BatteryMonitor can use
; synthetic battery curves. Do not publish as tester firmware.
[env:esp32s3-xiao-sim-80sps]
extends = env:esp32s3-xiao
build_flags =
  ${env:esp32s3-xiao.build_flags}
  -DWMBP_SIMULATION_MODE=1
  -DWMBP_SIM_HX711_HZ=80
  -DWMBP_SIM_SCENARIO=WMBP_SIM_SCENARIO_SHOT
  -DWMBP_SIM_BATTERY_PROFILE=WMBP_SIM_BATTERY_PROFILE_BASELINE

[env:esp32s3-xiao-sim-10sps]
