; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common configuration for both boards
[env]
platform = espressif32@6.12.0
framework = arduino
platform_packages =
  tasmota/tool-mklittlefs@^4.0.0
monitor_speed = 115200
board_build.filesystem = littlefs
upload_protocol = esptool
upload_speed = 460800
monitor_rts = 0
monitor_dtr = 0
extra_scripts = pre:tools/platformio_build_meta.py
build_flags = 
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Os
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=1
  -DCONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80
lib_deps = 
	robtillaart/HX711@0.6.4
	ESP32Async/ESPAsyncWebServer@3.12.0
	ESP32Async/AsyncTCP@3.5.0
	h2zero/NimBLE-Arduino@^1.4.0
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.11.9

; ESP32-S3-DevKitC-1 (SuperMini) Environment
[env:esp32s3-supermini]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = wmb_4mb_ota.csv
upload_flags = 
  --chip=esp32s3
  --before=default_reset
  --after=hard_reset
build_flags = 
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DBOARD_SUPERMINI

; XIAO ESP32S3 Environment  
[env:esp32s3-xiao]
board = seeed_xiao_esp32s3
board_upload.flash_size = 8MB
board_build.partitions = wmb_8mb_ota.csv
upload_flags = 
  --chip=esp32s3
  --before=default_reset
  --after=hard_reset
build_flags = 
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DBOARD_XIAO

[env:esp32s3-xiao-dout-interrupt]
extends = env:esp32s3-xiao
build_flags =
  ${env:esp32s3-xiao.build_flags}
  -DWMBP_ACQUISITION_DOUT_INTERRUPT=1

; Unexpected Maker TinyS3[D] Environment
; PlatformIO currently exposes the TinyS3 board definition; TinyS3[D] keeps
; the same ESP32-S3FN8/8MB shape but replaces VBAT ADC sense with an I2C
; MAX17048 fuel gauge.
[env:esp32s3-tinys3d]
board = um_tinys3
board_upload.flash_size = 8MB
board_build.partitions = wmb_8mb_ota.csv
upload_flags =
  --chip=esp32s3
  --before=default_reset
  --after=hard_reset
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DBOARD_TINYS3D

[env:esp32s3-tinys3d-dout-interrupt]
extends = env:esp32s3-tinys3d
build_flags =
  ${env:esp32s3-tinys3d.build_flags}
  -DWMBP_ACQUISITION_DOUT_INTERRUPT=1

; Explicit firmware simulation builds. These still run the real BLE/USB/web
; packet paths, but Scale bypasses HX711 hardware and BatteryMonitor can use
; synthetic battery curves. Do not publish as tester firmware.
[env:esp32s3-xiao-sim-80sps]
extends = env:esp32s3-xiao
build_flags =
  ${env:esp32s3-xiao.build_flags}
  -DWMBP_SIMULATION_MODE=1
  -DWMBP_SIM_HX711_HZ=80
  -DWMBP_SIM_SCENARIO=WMBP_SIM_SCENARIO_SHOT
  -DWMBP_SIM_BATTERY_PROFILE=WMBP_SIM_BATTERY_PROFILE_BASELINE

[env:esp32s3-xiao-sim-80sps-dout-interrupt]
extends = env:esp32s3-xiao-sim-80sps
build_flags =
  ${env:esp32s3-xiao-sim-80sps.build_flags}
  -DWMBP_ACQUISITION_DOUT_INTERRUPT=1

; Wokwi real-HX711 harness. This intentionally does not enable
; WMBP_SIMULATION_MODE, so it exercises the owned HX711 IO/acquisition path
; against the Wokwi HX711 part. Critical battery sleep is disabled only because
; Wokwi does not model the XIAO battery ADC/divider accurately enough for a
; long-running acquisition test.
[env:esp32s3-xiao-wokwi-hx711-dout-interrupt]
extends = env:esp32s3-xiao-dout-interrupt
build_flags =
  ${env:esp32s3-xiao-dout-interrupt.build_flags}
  -DWMBP_DISABLE_CRITICAL_BATTERY_SLEEP=1
  -DWMBP_WOKWI_RUNTIME_HARNESS=1
  -DWMBP_HX711_PULSE_SETTLE_US=3

; TinyS3[D] Wokwi harness. Wokwi does not currently provide an exact TinyS3[D]
; board part, so the diagram uses a generic ESP32-S3/XIAO carrier with the same
; WMB+ reference GPIO wiring plus a custom MAX17048 I2C fuel-gauge chip.
[env:esp32s3-tinys3d-wokwi-hx711-dout-interrupt]
extends = env:esp32s3-tinys3d-dout-interrupt
build_flags =
  ${env:esp32s3-tinys3d-dout-interrupt.build_flags}
  -DWMBP_DISABLE_CRITICAL_BATTERY_SLEEP=1
  -DWMBP_WOKWI_RUNTIME_HARNESS=1
  -DWMBP_HX711_PULSE_SETTLE_US=3

; Wokwi proxy for TinyS3[D] firmware features on Wokwi's known-working XIAO
; ESP32-S3 board model. This keeps the TinyS3[D] feature set enabled, including
; MAX17048 fuel gauge support, while avoiding TinyS3-specific USB serial
; emulation issues in Wokwi.
[env:esp32s3-tinys3d-wokwi-xiao-carrier-hx711-dout-interrupt]
extends = env:esp32s3-xiao-dout-interrupt
build_flags =
  ${env:esp32s3-xiao-dout-interrupt.build_flags}
  -UBOARD_XIAO
  -DBOARD_TINYS3D
  -DWMBP_DISABLE_CRITICAL_BATTERY_SLEEP=1
  -DWMBP_WOKWI_RUNTIME_HARNESS=1
  -DWMBP_HX711_PULSE_SETTLE_US=3

[env:esp32s3-xiao-sim-10sps]
extends = env:esp32s3-xiao
build_flags =
  ${env:esp32s3-xiao.build_flags}
  -DWMBP_SIMULATION_MODE=1
  -DWMBP_SIM_HX711_HZ=10
  -DWMBP_SIM_SCENARIO=WMBP_SIM_SCENARIO_SHOT
  -DWMBP_SIM_BATTERY_PROFILE=WMBP_SIM_BATTERY_PROFILE_BASELINE

[env:esp32s3-xiao-sim-glitch]
extends = env:esp32s3-xiao-sim-80sps
build_flags =
  ${env:esp32s3-xiao.build_flags}
  -DWMBP_SIMULATION_MODE=1
  -DWMBP_SIM_HX711_HZ=80
  -DWMBP_SIM_SCENARIO=WMBP_SIM_SCENARIO_GLITCH
  -DWMBP_SIM_BATTERY_PROFILE=WMBP_SIM_BATTERY_PROFILE_BASELINE

[env:esp32s3-xiao-sim-bump]
extends = env:esp32s3-xiao-sim-80sps
build_flags =
  ${env:esp32s3-xiao.build_flags}
  -DWMBP_SIMULATION_MODE=1
  -DWMBP_SIM_HX711_HZ=80
  -DWMBP_SIM_SCENARIO=WMBP_SIM_SCENARIO_BUMP
  -DWMBP_SIM_BATTERY_PROFILE=WMBP_SIM_BATTERY_PROFILE_BASELINE

[env:esp32s3-xiao-sim-battery-wifi-ap]
extends = env:esp32s3-xiao-sim-80sps
build_flags =
  ${env:esp32s3-xiao.build_flags}
  -DWMBP_SIMULATION_MODE=1
  -DWMBP_SIM_HX711_HZ=80
  -DWMBP_SIM_SCENARIO=WMBP_SIM_SCENARIO_IDLE
  -DWMBP_SIM_BATTERY_PROFILE=WMBP_SIM_BATTERY_PROFILE_WIFI_AP

[env:esp32s3-xiao-sim-battery-charging]
extends = env:esp32s3-xiao-sim-80sps
build_flags =
  ${env:esp32s3-xiao.build_flags}
  -DWMBP_SIMULATION_MODE=1
  -DWMBP_SIM_HX711_HZ=80
  -DWMBP_SIM_SCENARIO=WMBP_SIM_SCENARIO_IDLE
  -DWMBP_SIM_BATTERY_PROFILE=WMBP_SIM_BATTERY_PROFILE_CHARGING
