name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
  # WMB+ beta releases are currently created manually so prerelease notes,
  # asset names, and supported boards stay explicit. Keep this workflow manual
  # until release automation is rewritten for WMB+ instead of upstream naming.
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override version (e.g., 2.1.0-beta)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        environment: [esp32s3-supermini, esp32s3-xiao, esp32s3-tinys3d]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install PlatformIO
      run: |
        pip install platformio esptool
        pio upgrade --dev
        pio pkg update
        
    - name: Extract version information
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          # Extract version from git tag (remove 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_RELEASE=true" >> $GITHUB_OUTPUT
        elif [[ -n "${{ github.event.inputs.version_override }}" ]]; then
          # Use manual override
          VERSION="${{ github.event.inputs.version_override }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
        else
          # Development build
          VERSION="dev-$(date +%Y%m%d)"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
        fi
        
        # Extract build info
        BUILD_NUMBER=$GITHUB_RUN_NUMBER
        COMMIT_HASH=$(git rev-parse --short HEAD)
        BUILD_DATE=$(date -u +"%Y-%m-%d")
        BUILD_TIME=$(date -u +"%H:%M:%S")
        
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
        echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_OUTPUT
        echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_OUTPUT
        echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_OUTPUT
        
        echo "Building version: $VERSION"
        echo "Build number: $BUILD_NUMBER"
        echo "Commit: $COMMIT_HASH"
        
    - name: Build firmware
      run: |
        # Set build flags with version info. Keep values shell-token-safe:
        # PlatformIO splits PLATFORMIO_BUILD_FLAGS on whitespace.
        export PLATFORMIO_BUILD_FLAGS="\
          -DWEIGHMYBRU_BUILD_NUMBER=${{ steps.version.outputs.BUILD_NUMBER }} \
          -DWEIGHMYBRU_COMMIT_HASH=\\\"${{ steps.version.outputs.COMMIT_HASH }}\\\" \
          -DWEIGHMYBRU_BUILD_DATE=\\\"${{ steps.version.outputs.BUILD_DATE }}\\\" \
          -DWEIGHMYBRU_BUILD_TIME=\\\"${{ steps.version.outputs.BUILD_TIME }}\\\""
        
        echo "Building ${{ matrix.environment }} with flags: $PLATFORMIO_BUILD_FLAGS"
        
        # Build firmware
        pio run -e ${{ matrix.environment }}
        
        # Build filesystem
        pio run -e ${{ matrix.environment }} -t buildfs
        
    - name: Prepare release files
      run: |
        mkdir -p release
        
        # Determine board suffix for file naming
        if [[ "${{ matrix.environment }}" == "esp32s3-supermini" ]]; then
          BOARD_SUFFIX="supermini"
          BOARD_NAME="WMB+ - ESP32-S3 Supermini"
          LITTLEFS_OFFSET="0x310000"
        elif [[ "${{ matrix.environment }}" == "esp32s3-tinys3d" ]]; then
          BOARD_SUFFIX="tinys3d"
          BOARD_NAME="WMB+ - TinyS3[D]"
          LITTLEFS_OFFSET="0x610000"
        else
          BOARD_SUFFIX="xiao"
          BOARD_NAME="WMB+ - XIAO ESP32S3"
          LITTLEFS_OFFSET="0x610000"
        fi

        BASE_NAME="wmb-plus-${{ steps.version.outputs.VERSION }}-${BOARD_SUFFIX}"
        BUILD_DIR=".pio/build/${{ matrix.environment }}"
        
        # Copy and rename binaries with version
        cp "${BUILD_DIR}/firmware.bin" \
           "release/${BASE_NAME}-app.bin"
           
        # Check if LittleFS was built
        if [[ -f "${BUILD_DIR}/littlefs.bin" ]]; then
          cp "${BUILD_DIR}/littlefs.bin" \
             "release/${BASE_NAME}-littlefs.bin"
        fi
        
        # Copy bootloader and partitions for complete flashing
        if [[ -f "${BUILD_DIR}/bootloader.bin" ]]; then
          cp "${BUILD_DIR}/bootloader.bin" \
             "release/${BASE_NAME}-bootloader.bin"
        fi
        
        if [[ -f "${BUILD_DIR}/partitions.bin" ]]; then
          cp "${BUILD_DIR}/partitions.bin" \
             "release/${BASE_NAME}-partitions.bin"
        fi

        # Merged factory images for first install / partition-table migration.
        # Minimal excludes LittleFS; full includes the web UI filesystem.
        python -m esptool --chip esp32s3 merge_bin \
          -o "release/${BASE_NAME}-factory-minimal.bin" \
          0x0 "${BUILD_DIR}/bootloader.bin" \
          0x8000 "${BUILD_DIR}/partitions.bin" \
          0x10000 "${BUILD_DIR}/firmware.bin"

        python -m esptool --chip esp32s3 merge_bin \
          -o "release/${BASE_NAME}-factory-full.bin" \
          0x0 "${BUILD_DIR}/bootloader.bin" \
          0x8000 "${BUILD_DIR}/partitions.bin" \
          0x10000 "${BUILD_DIR}/firmware.bin" \
          "${LITTLEFS_OFFSET}" "${BUILD_DIR}/littlefs.bin"
        
        echo "BOARD_SUFFIX=$BOARD_SUFFIX" >> $GITHUB_ENV
        echo "BOARD_NAME=$BOARD_NAME" >> $GITHUB_ENV
        echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV
        echo "LITTLEFS_OFFSET=$LITTLEFS_OFFSET" >> $GITHUB_ENV
        
    - name: Generate ESP32 Web Tools manifest
      run: |
        BOARD_SUFFIX=${{ env.BOARD_SUFFIX }}
        VERSION=${{ steps.version.outputs.VERSION }}
        BOARD_NAME="${{ env.BOARD_NAME }}"
        BASE_NAME="${{ env.BASE_NAME }}"
        LITTLEFS_OFFSET="${{ env.LITTLEFS_OFFSET }}"
        CHIP_FAMILY="ESP32-S3"
        
        # Create ESP32 Web Tools manifest
        cat > release/manifest-${BOARD_SUFFIX}.json << EOF
        {
          "name": "$BOARD_NAME",
          "version": "$VERSION", 
          "home_assistant_domain": "weighmybru",
          "new_install_prompt_erase": false,
          "funding_url": "https://github.com/danielfcurrie-alt/weighmybru2",
          "builds": [
            {
              "chipFamily": "$CHIP_FAMILY",
              "parts": [
                {
                  "path": "${BASE_NAME}-bootloader.bin",
                  "offset": 0
                },
                {
                  "path": "${BASE_NAME}-partitions.bin",
                  "offset": 32768
                },
                {
                  "path": "${BASE_NAME}-app.bin",
                  "offset": 65536
                },
                {
                  "path": "${BASE_NAME}-littlefs.bin",
                  "offset": $((LITTLEFS_OFFSET))
                }
              ]
            }
          ]
        }
        EOF
        
        echo "Generated manifest for $BOARD_NAME v$VERSION"
        
    - name: Create build info file
      run: |
        cat > release/build-info-${{ env.BOARD_SUFFIX }}.json << EOF
        {
          "version": "${{ steps.version.outputs.VERSION }}",
          "board": "${{ matrix.environment }}",
          "build_number": ${{ steps.version.outputs.BUILD_NUMBER }},
          "commit_hash": "${{ steps.version.outputs.COMMIT_HASH }}",
          "build_date": "${{ steps.version.outputs.BUILD_DATE }}",
          "build_time": "${{ steps.version.outputs.BUILD_TIME }}",
          "is_release": ${{ steps.version.outputs.IS_RELEASE }},
          "github_run_id": "${{ github.run_id }}",
          "github_sha": "${{ github.sha }}"
        }
        EOF
        
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: weighmybru-${{ env.BOARD_SUFFIX }}-v${{ steps.version.outputs.VERSION }}
        path: release/
        retention-days: 90

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_OUTPUT
        
    - name: Organize release files
      run: |
        mkdir -p release-final
        
        # Combine all artifacts into one release folder
        find . -name "*.bin" -o -name "*.json" | while read file; do
          cp "$file" release-final/
        done

        # Generate one checksum file for the published release assets.
        (
          cd release-final
          rm -f "wmb-plus-${{ steps.version.outputs.VERSION }}-sha256.txt"
          find . -maxdepth 1 -type f ! -name "wmb-plus-${{ steps.version.outputs.VERSION }}-sha256.txt" -print \
            | sed 's#^\./##' \
            | sort \
            | while IFS= read -r file; do
                sha256sum "$file"
              done > "wmb-plus-${{ steps.version.outputs.VERSION }}-sha256.txt"
        )
        
        ls -la release-final/
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: WMB+ v${{ steps.version.outputs.VERSION }}
        files: release-final/*
        body: |
          ## WMB+ v${{ steps.version.outputs.VERSION }}
          
          ### 📦 Release Binaries
          
          **ESP32-S3 Supermini:**
          - `wmb-plus-${{ steps.version.outputs.VERSION }}-supermini-app.bin` - App firmware
          - `wmb-plus-${{ steps.version.outputs.VERSION }}-supermini-factory-full.bin` - First-install factory image with web UI
          - `wmb-plus-${{ steps.version.outputs.VERSION }}-supermini-factory-minimal.bin` - First-install factory image without web UI
          - `wmb-plus-${{ steps.version.outputs.VERSION }}-supermini-littlefs.bin` - Web interface files
          - `manifest-supermini.json` - ESP32 Web Tools manifest
          
          **XIAO ESP32S3:**
          - `wmb-plus-${{ steps.version.outputs.VERSION }}-xiao-app.bin` - App firmware
          - `wmb-plus-${{ steps.version.outputs.VERSION }}-xiao-factory-full.bin` - First-install factory image with web UI
          - `wmb-plus-${{ steps.version.outputs.VERSION }}-xiao-factory-minimal.bin` - First-install factory image without web UI
          - `wmb-plus-${{ steps.version.outputs.VERSION }}-xiao-littlefs.bin` - Web interface files
          - `manifest-xiao.json` - ESP32 Web Tools manifest

          **TinyS3[D]:**
          - `wmb-plus-${{ steps.version.outputs.VERSION }}-tinys3d-app.bin` - App firmware
          - `wmb-plus-${{ steps.version.outputs.VERSION }}-tinys3d-factory-full.bin` - First-install factory image with web UI
          - `wmb-plus-${{ steps.version.outputs.VERSION }}-tinys3d-factory-minimal.bin` - First-install factory image without web UI
          - `wmb-plus-${{ steps.version.outputs.VERSION }}-tinys3d-littlefs.bin` - Web interface files
          - `manifest-tinys3d.json` - ESP32 Web Tools manifest
          
          ### 🚀 Installation Options
          
          1. **First install / partition migration:** Download the matching `factory-full.bin` asset and flash once over USB.
          2. **Web OTA after factory install:** Download the matching `app.bin` or `littlefs.bin` asset from this release, then upload it from the scale's local Updates page.
          3. **Manual:** Download binaries and flash with esptool or PlatformIO.
          
          ### 📋 Requirements
          - ESP32-S3 Supermini, XIAO ESP32S3, or Unexpected Maker TinyS3[D] board
          - Load cell and HX711 amplifier
          - See [README.md](https://github.com/danielfcurrie-alt/weighmybru2/blob/v${{ steps.version.outputs.VERSION }}/README.md) for beta notes and wiring references
          
          ### 🔧 Build Information
          - Build: #${{ github.run_number }}
          - Commit: ${{ github.sha }}
          - Date: ${{ steps.version.outputs.BUILD_DATE }}
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
